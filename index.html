<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xtream Web Player</title>
  <!-- HLS.js Engine for Universal Video Decoding -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #1c2430;
      --card-active: #2a3648;
      --accent-color: #f97316;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      gap: 8px;
    }
    
    .back-btn { 
      background: none; 
      border: none; 
      color: var(--accent-color); 
      font-size: 0.85rem; 
      font-weight: 600; 
      cursor: pointer; 
      display: none; 
      white-space: nowrap;
    }

    .header-title { 
      font-size: 0.85rem; 
      font-weight: 700; 
      color: var(--text-main); 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .pip-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .top-nav {
      display: flex;
      background: #1e293b;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .nav-item {
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .nav-item.active {
      background: var(--accent-color);
      color: #fff;
    }

    .video-container { 
      width: 100%; 
      background: #000; 
      display: none; 
      aspect-ratio: 16 / 9; 
      position: relative;
    }
    video { width: 100%; height: 100%; display: block; object-fit: contain; }

    .content { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

    .login-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--border-radius);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .login-card h3 { font-size: 1rem; text-align: center; color: var(--text-main); margin-bottom: 2px; }
    .input-field {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #161e2e;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .input-field:focus { border-color: var(--accent-color); }
    
    .login-btn {
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 2px;
    }

    .search-box {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #161e2e;
      color: #fff;
      font-size: 0.85rem;
      display: none;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent-color); }

    .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .category-card {
      background: var(--card-bg);
      padding: 12px 8px;
      border-radius: var(--border-radius);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      min-height: 60px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .category-card:active { background: var(--card-active); }

    .item-list { display: flex; flex-direction: column; gap: 6px; }
    .item-card {
      background: var(--card-bg);
      padding: 8px 10px;
      border-radius: var(--border-radius);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .item-logo { width: 36px; height: 36px; border-radius: 6px; background: #0f172a; object-fit: contain; }
    .item-info { flex: 1; }
    .item-title { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
    .item-sub { font-size: 0.7rem; color: var(--text-sub); margin-top: 1px; }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" id="backBtn" onclick="goBack()">← Back</button>
    <div class="header-title" id="headerTitle">Xtream Player</div>
    <button class="pip-btn" id="pipBtn" onclick="togglePiP()">PiP</button>

    <div class="top-nav" id="topNav" style="display: none;">
      <div class="nav-item active" id="navLive" onclick="switchTab('live')">Live</div>
      <div class="nav-item" id="navSeries" onclick="switchTab('series')">Series</div>
    </div>
  </header>

  <div class="video-container" id="videoWrapper">
    <video id="player" controls playsinline webkit-playsinline preload="auto"></video>
  </div>

  <div class="content" id="mainContent">
    <div class="login-card" id="loginCard">
      <h3>Xtream Codes Login</h3>
      <input type="text" id="hostUrl" class="input-field" placeholder="Server URL (e.g. http://line.z3dream.top)">
      <input type="text" id="username" class="input-field" placeholder="Username">
      <input type="password" id="password" class="input-field" placeholder="Password">
      <button class="login-btn" onclick="handleLogin()">Connect</button>
    </div>

    <!-- Search bar is now positioned directly at the top of the content stream -->
    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search shows, episodes or channels..." oninput="filterItems()">
    <div class="category-grid" id="categoryView" style="display: none;"></div>
    <div class="item-list" id="itemView" style="display: none;"></div>
  </div>

  <script>
    let activeAuth = null;
    let currentMode = 'live';
    let navigationStack = [];
    let hlsInstance = null;
    let currentItemList = [];

    let liveCategories = {}, liveChannels = {};
    let seriesCategories = {}, seriesList = {};

    const loginCard = document.getElementById('loginCard');
    const categoryView = document.getElementById('categoryView');
    const itemView = document.getElementById('itemView');
    const headerTitle = document.getElementById('headerTitle');
    const backBtn = document.getElementById('backBtn');
    const pipBtn = document.getElementById('pipBtn');
    const topNav = document.getElementById('topNav');
    const videoWrapper = document.getElementById('videoWrapper');
    const player = document.getElementById('player');
    const searchInput = document.getElementById('searchInput');

    async function handleLogin() {
      let host = document.getElementById('hostUrl').value.trim();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!host || !user || !pass) return alert('Please fill in all fields.');

      if (!host.startsWith('http://') && !host.startsWith('https://')) host = 'http://' + host;
      if (host.endsWith('/')) host = host.slice(0, -1);

      activeAuth = { host, user, pass };
      loginCard.style.display = 'none';
      topNav.style.display = 'flex';
      loadLiveData();
    }

    async function loadLiveData() {
      headerTitle.innerText = "Loading Live TV...";
      const catUrl = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_live_categories`;
      const chanUrl = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_live_streams`;

      try {
        const catRes = await fetch(catUrl);
        const chanRes = await fetch(chanUrl);
        const categories = await catRes.json();
        const channels = await chanRes.json();

        processData(categories, channels, liveCategories, liveChannels, 'stream_id');
        renderCategories();
      } catch (err) {
        alert("Failed to load Live TV data.");
      }
    }

    async function loadSeriesData() {
      headerTitle.innerText = "Loading Series...";
      const catUrl = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_series_categories`;
      const seriesUrl = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_series`;

      try {
        const catRes = await fetch(catUrl);
        const seriesRes = await fetch(seriesUrl);
        const categories = await catRes.json();
        const series = await seriesRes.json();

        processData(categories, series, seriesCategories, seriesList, 'series_id');
        renderCategories();
      } catch (err) {
        alert("Failed to load TV Series data.");
      }
    }

    function processData(categories, items, catMap, groupMap, idKey) {
      Object.keys(catMap).forEach(k => delete catMap[k]);
      Object.keys(groupMap).forEach(k => delete groupMap[k]);

      const catArr = Array.isArray(categories) ? categories : Object.values(categories || {});
      const itemArr = Array.isArray(items) ? items : Object.values(items || {});

      catArr.forEach(c => {
        if (c && c.category_id) {
          catMap[c.category_id] = c.category_name;
          groupMap[c.category_name] = [];
        }
      });

      itemArr.forEach(i => {
        if (i && i[idKey]) {
          const cName = catMap[i.category_id] || "UNCATEGORIZED";
          if (!groupMap[cName]) groupMap[cName] = [];
          groupMap[cName].push(i);
        }
      });
    }

    function switchTab(mode) {
      if (!activeAuth) return;
      currentMode = mode;
      navigationStack = [];
      backBtn.style.display = 'none';
      searchInput.style.display = 'none';
      searchInput.value = '';

      document.getElementById('navLive').classList.toggle('active', mode === 'live');
      document.getElementById('navSeries').classList.toggle('active', mode === 'series');

      if (mode === 'live') {
        if (!Object.keys(liveCategories).length) loadLiveData();
        else renderCategories();
      } else {
        if (!Object.keys(seriesCategories).length) loadSeriesData();
        else renderCategories();
      }
    }

    function renderCategories() {
      categoryView.innerHTML = '';
      categoryView.style.display = 'grid';
      itemView.style.display = 'none';
      searchInput.style.display = 'none';
      headerTitle.innerText = currentMode === 'live' ? "Live Categories" : "Series Categories";

      const dataGroup = currentMode === 'live' ? liveChannels : seriesList;

      Object.keys(dataGroup).forEach(catName => {
        if (!dataGroup[catName].length) return;
        const card = document.createElement('div');
        card.className = 'category-card';
        card.innerText = catName;
        card.onclick = () => showCategoryItems(catName);
        categoryView.appendChild(card);
      });
    }

    function showCategoryItems(catName) {
      pushNavState(() => renderCategories());
      categoryView.style.display = 'none';
      itemView.style.display = 'flex';
      searchInput.style.display = 'block';
      searchInput.value = '';
      headerTitle.innerText = catName;

      currentItemList = (currentMode === 'live' ? liveChannels : seriesList)[catName] || [];
      renderItemList(currentItemList);
    }

    function renderItemList(items) {
      itemView.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        const logo = item.stream_icon || item.cover || 'https://via.placeholder.com/36?text=TV';
        
        card.innerHTML = `
          <img class="item-logo" src="${logo}" onerror="this.src='https://via.placeholder.com/36?text=TV'">
          <div class="item-info">
            <div class="item-title">${item.name}</div>
            <div class="item-sub">${currentMode === 'live' ? 'Live Stream' : 'TV Show'}</div>
          </div>
        `;

        if (currentMode === 'live') {
          card.onclick = () => playStream(`${activeAuth.host}/live/${activeAuth.user}/${activeAuth.pass}/${item.stream_id}.${item.container_extension || 'm3u8'}`);
        } else {
          card.onclick = () => loadSeriesEpisodes(item.series_id, item.name);
        }
        itemView.appendChild(card);
      });
    }

    function filterItems() {
      const query = searchInput.value.toLowerCase();
      const filtered = currentItemList.filter(item => item.name.toLowerCase().includes(query));
      renderItemList(filtered);
    }

    async function loadSeriesEpisodes(seriesId, seriesName) {
      pushNavState(() => showCategoryItems(headerTitle.innerText));
      headerTitle.innerText = "Loading Episodes...";
      itemView.innerHTML = '';
      
      const url = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_series_info&series_id=${seriesId}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        
        // Flatten all seasons and episodes into one array so search bar works inside the show too!
        currentItemList = [];
        const seasons = data.episodes || {};
        Object.keys(seasons).forEach(seasonNum => {
          seasons[seasonNum].forEach(ep => {
            currentItemList.push({
              name: `S${seasonNum} E${ep.episode_num} - ${ep.title || 'Episode ' + ep.episode_num}`,
              id: ep.id,
              container_extension: ep.container_extension || 'mp4'
            });
          });
        });

        searchInput.style.display = 'block';
        searchInput.value = '';
        renderEpisodeList(currentItemList);
        headerTitle.innerText = seriesName;
      } catch (err) {
        alert("Failed to fetch episodes.");
      }
    }

    function renderEpisodeList(items) {
      itemView.innerHTML = '';
      items.forEach(ep => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
          <div class="item-info">
            <div class="item-title">${ep.name}</div>
            <div class="item-sub">Play Episode</div>
          </div>
        `;
        const epUrl = `${activeAuth.host}/series/${activeAuth.user}/${activeAuth.pass}/${ep.id}.${ep.container_extension}`;
        card.onclick = () => playStream(epUrl);
        itemView.appendChild(card);
      });
    }

    // Override filter function to support episodes too
    function filterItems() {
      const query = searchInput.value.toLowerCase();
      const filtered = currentItemList.filter(item => item.name.toLowerCase().includes(query));
      if (currentMode === 'series' && navigationStack.length > 2) {
        renderEpisodeList(filtered);
      } else {
        renderItemList(filtered);
      }
    }

    function playStream(url) {
      videoWrapper.style.display = 'block';
      if (document.pictureInPictureEnabled || player.webkitSupportsPresentationMode) {
        pipBtn.style.display = 'block';
      }

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (Hls.isSupported() && (url.includes('.m3u8') || !player.canPlayType('video/mp4'))) {
        hlsInstance = new Hls({ enableWorker: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(player);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => player.play());
      } else {
        player.src = url;
        player.play().catch(e => console.warn('Native playback error:', e));
      }

      videoWrapper.scrollIntoView({ behavior: 'smooth' });
    }

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await player.requestPictureInPicture();
        } else if (player.webkitSupportsPresentationMode) {
          const mode = player.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture';
          player.webkitSetPresentationMode(mode);
        }
      } catch (err) {
        console.log('PiP failed:', err);
      }
    }

    function pushNavState(restoreFn) {
      navigationStack.push(restoreFn);
      backBtn.style.display = 'block';
    }

    function goBack() {
      if (navigationStack.length > 0) {
        const restore = navigationStack.pop();
        restore();
      }
      if (navigationStack.length === 0) {
        backBtn.style.display = 'none';
        searchInput.style.display = 'none';
      }
    }
  </script>
</body>
</html>

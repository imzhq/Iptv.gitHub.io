<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M3U Web Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #1c2430;
      --card-active: #2a3648;
      --accent-color: #f97316;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      gap: 8px;
    }
    
    .back-btn { 
      background: none; border: none; color: var(--accent-color); 
      font-size: 0.85rem; font-weight: 600; cursor: pointer; display: none; white-space: nowrap;
    }

    .header-title { 
      font-size: 0.85rem; font-weight: 700; color: var(--text-main); 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }

    .pip-btn {
      background: #1e293b; border: 1px solid #334155; color: #fff;
      padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; display: none;
    }

    .video-container { 
      width: 100%; background: #000; display: none; aspect-ratio: 16 / 9; position: relative; flex-shrink: 0; 
    }
    video { width: 100%; height: 100%; display: block; object-fit: contain; }

    .content { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

    .login-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--border-radius);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .login-card h3 { font-size: 1rem; text-align: center; color: var(--text-main); margin-bottom: 2px; }
    .input-field {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #334155; background: #161e2e; color: #fff; font-size: 0.85rem; outline: none;
    }
    .input-field:focus { border-color: var(--accent-color); }
    
    .login-btn {
      padding: 10px; border-radius: 8px; border: none;
      background: var(--accent-color); color: #fff; font-weight: bold; font-size: 0.85rem; cursor: pointer;
    }

    .search-box {
      width: 100%; padding: 8px 12px; border-radius: 8px;
      border: 1px solid #334155; background: #161e2e; color: #fff; font-size: 0.85rem; display: none; outline: none;
    }
    .search-box:focus { border-color: var(--accent-color); }

    .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .category-card {
      background: var(--card-bg); padding: 12px 8px; border-radius: var(--border-radius);
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      display: flex; align-items: center; justify-content: center; text-align: center;
      cursor: pointer; min-height: 60px; border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .category-card:active { background: var(--card-active); }

    .item-list { display: flex; flex-direction: column; gap: 6px; }
    .item-card {
      background: var(--card-bg); padding: 8px 10px; border-radius: var(--border-radius);
      display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .item-logo { width: 36px; height: 36px; border-radius: 6px; background: #0f172a; object-fit: contain; }
    .item-info { flex: 1; }
    .item-title { font-size: 0.85rem; font-weight: 600; color: var(--text-main); }
    .item-sub { font-size: 0.7rem; color: var(--text-sub); margin-top: 1px; }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" id="backBtn" onclick="goBack()">← Back</button>
    <div class="header-title" id="headerTitle">M3U Playlist Player</div>
    <button class="pip-btn" id="pipBtn" onclick="togglePiP()">PiP</button>
  </header>

  <div class="video-container" id="videoWrapper">
    <video id="player" controls playsinline webkit-playsinline preload="auto"></video>
  </div>

  <div class="content" id="mainContent">
    <div class="login-card" id="loginCard">
      <h3>M3U Playlist Login</h3>
      <input type="text" id="m3uUrl" class="input-field" placeholder="Paste M3U / M3U8 URL here...">
      <button class="login-btn" onclick="loadM3UPlaylist()">Load Playlist</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search channels..." oninput="filterChannels()">
    <div class="category-grid" id="categoryView" style="display: none;"></div>
    <div class="item-list" id="itemView" style="display: none;"></div>
  </div>

  <script>
    let categories = {};
    let allItems = [];
    let navigationStack = [];
    let hlsInstance = null;

    const loginCard = document.getElementById('loginCard');
    const categoryView = document.getElementById('categoryView');
    const itemView = document.getElementById('itemView');
    const headerTitle = document.getElementById('headerTitle');
    const backBtn = document.getElementById('backBtn');
    const pipBtn = document.getElementById('pipBtn');
    const videoWrapper = document.getElementById('videoWrapper');
    const player = document.getElementById('player');
    const searchInput = document.getElementById('searchInput');

    async function loadM3UPlaylist() {
      const url = document.getElementById('m3uUrl').value.trim();
      if (!url) return alert('Please enter a valid M3U playlist URL.');

      headerTitle.innerText = "Downloading Playlist...";
      
      try {
        // Note: CORS restrictions in standard browsers might require a CORS proxy if the IPTV provider doesn't allow cross-origin requests.
        const response = await fetch(url);
        const text = await response.text();
        
        parseM3U(text);
        loginCard.style.display = 'none';
        searchInput.style.display = 'block';
        renderCategories();
      } catch (err) {
        alert("Failed to load M3U file. Ensure the URL is correct or check for browser CORS restrictions.");
        headerTitle.innerText = "M3U Playlist Player";
      }
    }

    function parseM3U(data) {
      categories = {};
      allItems = [];

      const lines = data.split('\n');
      let currentItem = null;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          currentItem = { name: '', logo: '', group: 'General', url: '' };

          // Extract Group Name
          let groupMatch = line.match(/group-title="([^"]+)"/i);
          if (groupMatch) currentItem.group = groupMatch[1];

          // Extract Logo
          let logoMatch = line.match(/tvg-logo="([^"]+)"/i);
          if (logoMatch) currentItem.logo = logoMatch[1];

          // Extract Title (everything after the last comma)
          let commaIndex = line.lastIndexOf(',');
          if (commaIndex !== -1) {
            currentItem.name = line.substring(commaIndex + 1).trim();
          }
        } else if (line && !line.startsWith('#') && currentItem) {
          currentItem.url = line;
          
          if (!categories[currentItem.group]) {
            categories[currentItem.group] = [];
          }
          categories[currentItem.group].push(currentItem);
          allItems.push(currentItem);

          currentItem = null;
        }
      }
    }

    function renderCategories() {
      categoryView.innerHTML = '';
      categoryView.style.display = 'grid';
      itemView.style.display = 'none';
      searchInput.value = '';
      headerTitle.innerText = "Playlist Categories";

      Object.keys(categories).forEach(groupName => {
        if (!categories[groupName].length) return;
        const card = document.createElement('div');
        card.className = 'category-card';
        card.innerText = groupName;
        card.onclick = () => showCategoryItems(groupName);
        categoryView.appendChild(card);
      });
    }

    function showCategoryItems(groupName) {
      pushNavState(() => renderCategories());
      categoryView.style.display = 'none';
      itemView.style.display = 'flex';
      headerTitle.innerText = groupName;
      renderItemList(categories[groupName] || []);
    }

    function renderItemList(items) {
      itemView.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        const logo = item.logo || 'https://via.placeholder.com/36?text=TV';
        
        card.innerHTML = `
          <img class="item-logo" src="${logo}" onerror="this.src='https://via.placeholder.com/36?text=TV'">
          <div class="item-info">
            <div class="item-title">${item.name}</div>
            <div class="item-sub">${item.group}</div>
          </div>
        `;
        card.onclick = () => playStream(item.url);
        itemView.appendChild(card);
      });
    }

    function filterChannels() {
      const query = searchInput.value.toLowerCase().trim();
      if (!query) {
        if (navigationStack.length === 0) renderCategories();
        return;
      }

      categoryView.style.display = 'none';
      itemView.style.display = 'flex';
      headerTitle.innerText = `Search: "${query}"`;

      const matched = allItems.filter(i => i.name && i.name.toLowerCase().includes(query)).slice(0, 50);
      renderItemList(matched);
    }

    function playStream(url) {
      videoWrapper.style.display = 'block';
      if (document.pictureInPictureEnabled || player.webkitSupportsPresentationMode) {
        pipBtn.style.display = 'block';
      }

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (Hls.isSupported() && (url.includes('.m3u8') || !player.canPlayType('video/mp4'))) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(player);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => player.play().catch(e => console.log(e)));
      } else {
        player.src = url;
        player.load();
        player.play().catch(e => console.warn('Playback failed:', e));
      }

      videoWrapper.scrollIntoView({ behavior: 'smooth' });
    }

    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled) {
          await player.requestPictureInPicture();
        } else if (player.webkitSupportsPresentationMode) {
          const mode = player.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture';
          player.webkitSetPresentationMode(mode);
        }
      } catch (err) {
        console.log('PiP failed:', err);
      }
    }

    function pushNavState(restoreFn) {
      navigationStack.push(restoreFn);
      backBtn.style.display = 'block';
    }

    function goBack() {
      if (navigationStack.length > 0) {
        const restore = navigationStack.pop();
        restore();
      }
      if (navigationStack.length === 0) {
        backBtn.style.display = 'none';
        renderCategories();
      }
    }
  </script>
</body>
</html>

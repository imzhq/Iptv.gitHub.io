<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xtream Web Player</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #1c2430;
      --card-active: #2a3648;
      --accent-color: #f97316;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-color);
      border-bottom: 1px solid #1e293b;
    }
    .header-title { font-size: 1.1rem; font-weight: 700; text-align: center; flex: 1; color: var(--text-main); }
    .back-btn { background: none; border: none; color: var(--accent-color); font-size: 1rem; font-weight: 600; cursor: pointer; display: none; }

    .video-container {
      width: 100%;
      background: #000;
      display: none;
      aspect-ratio: 16 / 9;
    }
    video { width: 100%; height: 100%; display: block; }

    .content { flex: 1; overflow-y: auto; padding: 16px; }

    .login-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--border-radius);
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .login-card h3 { font-size: 1.1rem; text-align: center; color: var(--text-main); margin-bottom: 4px; }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #161e2e;
      color: #fff;
      font-size: 0.9rem;
    }
    .login-btn {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 4px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .category-card {
      background: var(--card-bg);
      padding: 18px 12px;
      border-radius: var(--border-radius);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      min-height: 80px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .category-card:active { background: var(--card-active); }

    .channel-list { display: flex; flex-direction: column; gap: 10px; }
    .channel-card {
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: var(--border-radius);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .channel-logo {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: #0f172a;
      object-fit: contain;
    }
    .channel-info { flex: 1; }
    .channel-title { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
    .channel-sub { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }

    nav {
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      background-color: #0f172a;
      border-top: 1px solid #1e293b;
    }
    .nav-item { color: var(--text-sub); text-align: center; font-size: 0.75rem; text-decoration: none; }
    .nav-item.active { color: var(--accent-color); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" id="backBtn" onclick="showCategories()">← Back</button>
    <div class="header-title" id="headerTitle">Xtream API Login</div>
  </header>

  <div class="video-container" id="videoWrapper">
    <video id="player" controls playsinline webkit-playsinline></video>
  </div>

  <div class="content">
    <div class="login-card" id="loginCard">
      <h3>Xtream Codes Login</h3>
      <input type="text" id="hostUrl" class="input-field" placeholder="Server URL (e.g. http://line.z3dream.top)">
      <input type="text" id="username" class="input-field" placeholder="Username">
      <input type="password" id="password" class="input-field" placeholder="Password">
      <button class="login-btn" onclick="handleLogin()">Connect</button>
    </div>

    <div class="category-grid" id="categoryView" style="display: none;"></div>
    <div class="channel-list" id="channelView" style="display: none;"></div>
  </div>

  <nav>
    <div class="nav-item">Home</div>
    <div class="nav-item active">Live TV</div>
    <div class="nav-item">Series</div>
    <div class="nav-item">Movies</div>
  </nav>

  <script>
    let categoriesMap = {};
    let channelsGrouped = {};
    let activeAuth = null;

    const loginCard = document.getElementById('loginCard');
    const categoryView = document.getElementById('categoryView');
    const channelView = document.getElementById('channelView');
    const headerTitle = document.getElementById('headerTitle');
    const backBtn = document.getElementById('backBtn');
    const videoWrapper = document.getElementById('videoWrapper');
    const player = document.getElementById('player');

    async function handleLogin() {
      let host = document.getElementById('hostUrl').value.trim();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!host || !user || !pass) return alert('Please complete all fields.');

      if (!host.startsWith('http://') && !host.startsWith('https://')) {
        host = 'http://' + host;
      }
      if (host.endsWith('/')) host = host.slice(0, -1);

      activeAuth = { host, user, pass };
      loadXtreamData(host, user, pass);
    }

    async function loadXtreamData(host, user, pass) {
      headerTitle.innerText = "Loading Channels...";
      loginCard.style.display = 'none';

      // Direct direct calls with NO proxy
      const catUrl = `${host}/player_api.php?username=${user}&password=${pass}&action=get_live_categories`;
      const chanUrl = `${host}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`;

      try {
        const catRes = await fetch(catUrl);
        const categories = await catRes.json();

        const chanRes = await fetch(chanUrl);
        const channels = await chanRes.json();

        processXtreamData(categories, channels);
      } catch (err) {
        alert("Connection failed. Check your credentials or IPTV server details.");
        loginCard.style.display = 'flex';
        headerTitle.innerText = "Xtream API Login";
      }
    }

    function processXtreamData(categories, channels) {
      categoriesMap = {};
      channelsGrouped = {};

      const catArray = Array.isArray(categories) ? categories : Object.values(categories || {});
      const chanArray = Array.isArray(channels) ? channels : Object.values(channels || {});

      if (!catArray.length && !chanArray.length) {
        alert("Invalid login details or empty response.");
        loginCard.style.display = 'flex';
        headerTitle.innerText = "Xtream API Login";
        return;
      }

      catArray.forEach(cat => {
        if (cat && cat.category_id) {
          categoriesMap[cat.category_id] = cat.category_name;
          channelsGrouped[cat.category_name] = [];
        }
      });

      chanArray.forEach(ch => {
        if (ch && ch.stream_id) {
          const catName = categoriesMap[ch.category_id] || "UNCATEGORIZED";
          if (!channelsGrouped[catName]) channelsGrouped[catName] = [];
          
          channelsGrouped[catName].push({
            id: ch.stream_id,
            name: ch.name,
            logo: ch.stream_icon,
            extension: ch.container_extension || 'm3u8'
          });
        }
      });

      renderCategories();
    }

    function renderCategories() {
      categoryView.innerHTML = '';
      categoryView.style.display = 'grid';
      channelView.style.display = 'none';
      headerTitle.innerText = "Live TV Categories";

      Object.keys(channelsGrouped).forEach(catName => {
        if (channelsGrouped[catName].length === 0) return;

        const card = document.createElement('div');
        card.className = 'category-card';
        card.innerText = catName;
        card.onclick = () => showChannels(catName);
        categoryView.appendChild(card);
      });
    }

    function showChannels(catName) {
      categoryView.style.display = 'none';
      channelView.style.display = 'flex';
      backBtn.style.display = 'block';
      headerTitle.innerText = catName;

      channelView.innerHTML = '';
      const channels = channelsGrouped[catName] || [];

      channels.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.innerHTML = `
          <img class="channel-logo" src="${ch.logo}" alt="tv" onerror="this.src='https://via.placeholder.com/44?text=TV'">
          <div class="channel-info">
            <div class="channel-title">${ch.name}</div>
            <div class="channel-sub">Live Broadcast</div>
          </div>
        `;
        card.onclick = () => playStream(ch.id, ch.extension);
        channelView.appendChild(card);
      });
    }

    function showCategories() {
      channelView.style.display = 'none';
      categoryView.style.display = 'grid';
      backBtn.style.display = 'none';
      headerTitle.innerText = 'Live TV Categories';
    }

    function playStream(streamId, ext) {
      if (!activeAuth) return;

      // Direct HTTP stream path
      const streamUrl = `${activeAuth.host}/live/${activeAuth.user}/${activeAuth.pass}/${streamId}.${ext}`;
      videoWrapper.style.display = 'block';

      if (player.canPlayType('application/vnd.apple.mpegurl')) {
        player.src = streamUrl;
        player.play();
      } else {
        // Fallback setting for browsers/players that play streams directly
        player.src = streamUrl;
        player.play();
      }
    }
  </script>
</body>
</html>

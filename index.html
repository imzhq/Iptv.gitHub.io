<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Xtream Web Player</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #1c2430;
      --card-active: #2a3648;
      --accent-color: #f97316;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* TOP HEADER & NAVIGATION */
    header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      gap: 12px;
    }
    
    .back-btn { 
      background: none; 
      border: none; 
      color: var(--accent-color); 
      font-size: 1rem; 
      font-weight: 600; 
      cursor: pointer; 
      display: none; 
      white-space: nowrap;
    }

    .header-title { 
      font-size: 1rem; 
      font-weight: 700; 
      color: var(--text-main); 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .top-nav {
      display: flex;
      background: #1e293b;
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .nav-item {
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .nav-item.active {
      background: var(--accent-color);
      color: #fff;
    }

    /* PLAYER CONTAINER */
    .video-container { width: 100%; background: #000; display: none; aspect-ratio: 16 / 9; }
    video { width: 100%; height: 100%; display: block; }

    /* CONTENT AREA */
    .content { flex: 1; overflow-y: auto; padding: 16px; }

    .login-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: var(--border-radius);
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .login-card h3 { font-size: 1.1rem; text-align: center; color: var(--text-main); margin-bottom: 4px; }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #161e2e;
      color: #fff;
      font-size: 0.9rem;
    }
    .login-btn {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--accent-color);
      color: #fff;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 4px;
    }

    .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .category-card {
      background: var(--card-bg);
      padding: 18px 12px;
      border-radius: var(--border-radius);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      min-height: 80px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .category-card:active { background: var(--card-active); }

    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .item-card {
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: var(--border-radius);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .item-logo { width: 44px; height: 44px; border-radius: 8px; background: #0f172a; object-fit: contain; }
    .item-info { flex: 1; }
    .item-title { font-size: 0.95rem; font-weight: 600; color: var(--text-main); }
    .item-sub { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }
  </style>
</head>
<body>

  <header>
    <button class="back-btn" id="backBtn" onclick="goBack()">← Back</button>
    <div class="header-title" id="headerTitle">Xtream Player</div>

    <div class="top-nav" id="topNav" style="display: none;">
      <div class="nav-item active" id="navLive" onclick="switchTab('live')">Live</div>
      <div class="nav-item" id="navSeries" onclick="switchTab('series')">Series</div>
    </div>
  </header>

  <div class="video-container" id="videoWrapper">
    <video id="player" controls playsinline webkit-playsinline></video>
  </div>

  <div class="content">
    <div class="login-card" id="loginCard">
      <h3>Xtream Codes Login</h3>
      <input type="text" id="hostUrl" class="input-field" placeholder="Server URL (e.g. http://line.z3dream.top)">
      <input type="text" id="username" class="input-field" placeholder="Username">
      <input type="password" id="password" class="input-field" placeholder="Password">
      <button class="login-btn" onclick="handleLogin()">Connect</button>
    </div>

    <div class="category-grid" id="categoryView" style="display: none;"></div>
    <div class="item-list" id="itemView" style="display: none;"></div>
  </div>

  <script>
    let activeAuth = null;
    let currentMode = 'live';
    let navigationStack = [];

    let liveCategories = {}, liveChannels = {};
    let seriesCategories = {}, seriesList = {};

    const loginCard = document.getElementById('loginCard');
    const categoryView = document.getElementById('categoryView');
    const itemView = document.getElementById('itemView');
    const headerTitle = document.getElementById('headerTitle');
    const backBtn = document.getElementById('backBtn');
    const topNav = document.getElementById('topNav');
    const videoWrapper = document.getElementById('videoWrapper');
    const player = document.getElementById('player');

    async function handleLogin() {
      let host = document.getElementById('hostUrl').value.trim();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if (!host || !user || !pass) return alert('Please fill in all fields.');

      if (!host.startsWith('http://') && !host.startsWith('https://')) host = 'http://' + host;
      if (host.endsWith('/')) host = host.slice(0, -1);

      activeAuth = { host, user, pass };
      loginCard.style.display = 'none';
      topNav.style.display = 'flex';
      loadLiveData();
    }

    async function loadLiveData() {
      headerTitle.innerText = "Loading Live TV...";
      const catUrl = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_live_categories`;
      const chanUrl = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_live_streams`;

      try {
        const catRes = await fetch(catUrl);
        const chanRes = await fetch(chanUrl);
        const categories = await catRes.json();
        const channels = await chanRes.json();

        processData(categories, channels, liveCategories, liveChannels, 'stream_id');
        renderCategories();
      } catch (err) {
        alert("Failed to load Live TV data.");
      }
    }

    async function loadSeriesData() {
      headerTitle.innerText = "Loading Series...";
      const catUrl = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_series_categories`;
      const seriesUrl = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_series`;

      try {
        const catRes = await fetch(catUrl);
        const seriesRes = await fetch(seriesUrl);
        const categories = await catRes.json();
        const series = await seriesRes.json();

        processData(categories, series, seriesCategories, seriesList, 'series_id');
        renderCategories();
      } catch (err) {
        alert("Failed to load TV Series data.");
      }
    }

    function processData(categories, items, catMap, groupMap, idKey) {
      Object.keys(catMap).forEach(k => delete catMap[k]);
      Object.keys(groupMap).forEach(k => delete groupMap[k]);

      const catArr = Array.isArray(categories) ? categories : Object.values(categories || {});
      const itemArr = Array.isArray(items) ? items : Object.values(items || {});

      catArr.forEach(c => {
        if (c && c.category_id) {
          catMap[c.category_id] = c.category_name;
          groupMap[c.category_name] = [];
        }
      });

      itemArr.forEach(i => {
        if (i && i[idKey]) {
          const cName = catMap[i.category_id] || "UNCATEGORIZED";
          if (!groupMap[cName]) groupMap[cName] = [];
          groupMap[cName].push(i);
        }
      });
    }

    function switchTab(mode) {
      if (!activeAuth) return;
      currentMode = mode;
      navigationStack = [];
      backBtn.style.display = 'none';

      document.getElementById('navLive').classList.toggle('active', mode === 'live');
      document.getElementById('navSeries').classList.toggle('active', mode === 'series');

      if (mode === 'live') {
        if (!Object.keys(liveCategories).length) loadLiveData();
        else renderCategories();
      } else {
        if (!Object.keys(seriesCategories).length) loadSeriesData();
        else renderCategories();
      }
    }

    function renderCategories() {
      categoryView.innerHTML = '';
      categoryView.style.display = 'grid';
      itemView.style.display = 'none';
      headerTitle.innerText = currentMode === 'live' ? "Live Categories" : "Series Categories";

      const dataGroup = currentMode === 'live' ? liveChannels : seriesList;

      Object.keys(dataGroup).forEach(catName => {
        if (!dataGroup[catName].length) return;
        const card = document.createElement('div');
        card.className = 'category-card';
        card.innerText = catName;
        card.onclick = () => showCategoryItems(catName);
        categoryView.appendChild(card);
      });
    }

    function showCategoryItems(catName) {
      pushNavState(() => renderCategories());
      categoryView.style.display = 'none';
      itemView.style.display = 'flex';
      headerTitle.innerText = catName;
      itemView.innerHTML = '';

      const items = (currentMode === 'live' ? liveChannels : seriesList)[catName] || [];

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        const logo = item.stream_icon || item.cover || 'https://via.placeholder.com/44?text=TV';
        
        card.innerHTML = `
          <img class="item-logo" src="${logo}" onerror="this.src='https://via.placeholder.com/44?text=TV'">
          <div class="item-info">
            <div class="item-title">${item.name}</div>
            <div class="item-sub">${currentMode === 'live' ? 'Live Stream' : 'TV Show'}</div>
          </div>
        `;

        if (currentMode === 'live') {
          card.onclick = () => playStream(`${activeAuth.host}/live/${activeAuth.user}/${activeAuth.pass}/${item.stream_id}.${item.container_extension || 'm3u8'}`);
        } else {
          card.onclick = () => loadSeriesEpisodes(item.series_id, item.name);
        }
        itemView.appendChild(card);
      });
    }

    async function loadSeriesEpisodes(seriesId, seriesName) {
      pushNavState(() => showCategoryItems(headerTitle.innerText));
      headerTitle.innerText = "Loading Episodes...";
      itemView.innerHTML = '';

      const url = `${activeAuth.host}/player_api.php?username=${activeAuth.user}&password=${activeAuth.pass}&action=get_series_info&series_id=${seriesId}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        renderEpisodes(data.episodes || {}, seriesName);
      } catch (err) {
        alert("Failed to fetch episodes.");
      }
    }

    function renderEpisodes(seasons, seriesName) {
      headerTitle.innerText = seriesName;
      itemView.innerHTML = '';

      Object.keys(seasons).forEach(seasonNum => {
        seasons[seasonNum].forEach(ep => {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <div class="item-info">
              <div class="item-title">S${seasonNum} E${ep.episode_num} - ${ep.title || 'Episode ' + ep.episode_num}</div>
              <div class="item-sub">Play Episode</div>
            </div>
          `;
          card.onclick = () => playStream(`${activeAuth.host}/series/${activeAuth.user}/${activeAuth.pass}/${ep.id}.${ep.container_extension || 'mp4'}`);
          itemView.appendChild(card);
        });
      });
    }

    function playStream(url) {
      videoWrapper.style.display = 'block';
      player.src = url;
      player.play();
    }

    function pushNavState(restoreFn) {
      navigationStack.push(restoreFn);
      backBtn.style.display = 'block';
    }

    function goBack() {
      if (navigationStack.length > 0) {
        const restore = navigationStack.pop();
        restore();
      }
      if (navigationStack.length === 0) {
        backBtn.style.display = 'none';
      }
    }
  </script>
</body>
</html>
